version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: test-insights-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_insights
      POSTGRES_PASSWORD: test_insights_dev
      POSTGRES_DB: test_insights
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_insights -d test_insights']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
